services:
  - type: web
    name: shadowmem-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SHADOWMEM_HOST
        value: 0.0.0.0
      - key: SHADOWMEM_CORS_ORIGINS
        value: "*"
      - key: SHADOWMEM_LOG_LEVEL
        value: INFO
